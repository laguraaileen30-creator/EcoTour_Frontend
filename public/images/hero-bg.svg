<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#052017"/>
      <stop offset="40%" stop-color="#083021"/>
      <stop offset="100%" stop-color="#0b2818"/>
    </linearGradient>
    <radialGradient id="g2" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#164c3a" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#0b2818" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0%" stop-color="#3dd6be" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#109977" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#094c3a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- background base -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- soft light bokeh -->
  <g opacity="0.35" filter="url(#blur)">
    <circle cx="260" cy="200" r="220" fill="#1f5b44" />
    <circle cx="1200" cy="150" r="180" fill="#1e5c45" />
    <circle cx="900" cy="600" r="260" fill="#123b2c" />
  </g>

  <!-- subtle radial vignette -->
  <rect width="100%" height="100%" fill="url(#g2)" />

  <!-- water shimmer shape -->
  <path d="M160 520 C 260 420, 420 420, 520 520 C 720 700, 880 680, 1040 520 C 1200 360, 1360 360, 1440 520 L 1440 900 L 160 900 Z"
        fill="url(#water)" opacity="0.14"/>

  <!-- silhouette island (faint) -->
  <path d="M420 460 C380 380, 520 340, 660 360 C780 380, 860 460, 940 480 C1000 500, 1080 520, 1180 500 C1240 490, 1320 520, 1400 600 L1400 680 L200 680 L200 600 C300 520, 360 520, 420 460 Z"
        fill="#063423" opacity="0.22" />

  <!-- light texture overlay -->
  <g opacity="0.06">
    <rect width="100%" height="100%" fill="white"/>
    <rect width="100%" height="100%" fill="black" style="mix-blend-mode:overlay"/>
  </g>

  <!-- gentle leaf shapes -->
  <g fill="#115b3f" opacity="0.12">
    <ellipse cx="130" cy="680" rx="240" ry="80" transform="rotate(-15 130 680)" />
    <ellipse cx="1450" cy="720" rx="260" ry="100" transform="rotate(8 1450 720)" />
  </g>

  <!-- final soft vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.14" />
</svg>
